openapi: 3.1.0
info:
  title: Pet Hospital API
  description: API for pet hospital
  version: 1.0.0
servers:
  - url: /pets
tags:
  - name: Pet
paths:
  /pets:
    post:
      tags:
        - Pet
      summary: Create pet
      description: Create a new pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createPetRequest"
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    get:
      tags:
        - Pet
      summary: List pets
      description: List all pets
      operationId: listPets
      responses:
        '200':
          description: List of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listPetsResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /pets/{petId}:
    get:
      tags:
        - Pet
      summary: Get pet by id
      description: Get a pet by id
      operationId: getPet
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: integer
          description: Pet id
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    put:
      tags:
        - Pet
      summary: Update pet
      description: Update a pet
      operationId: updatePet
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: integer
          description: Pet id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updatePetRequest"
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
    delete:
      tags:
        - Pet
      summary: Delete pet
      description: Delete a pet
      operationId: deletePet
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: integer
          description: Pet id
      responses:
        '200':
          description: Pet deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteResponse"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
components:
  schemas:
    createPetRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Name of the pet
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        category:
          type: string
          description: Pet category
    deleteResponse:
      type: object
      properties:
        message:
          type: string
    errorResponse:
      type: object
      properties:
        message:
          type: string
    listPetsResponse:
      type: array
      items:
        $ref: "#/components/schemas/petResponse"
    petResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        category:
          type: string
    updatePetRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
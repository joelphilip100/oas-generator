openapi: 3.1.0
info:
  title: Pet Hospital API
  description: API for pet hospital
  version: 1.0.0
servers:
  - url: /petstore-api
tags:
  - name: Pet
paths:
  /pets:
    post:
      tags:
        - Pet
      summary: Create pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createPetRequest"
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
    get:
      tags:
        - Pet
      summary: List pets
      responses:
        '200':
          description: List of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listPetsResponse"
  /pets/{petId}:
    get:
      tags:
        - Pet
      summary: Get pet by id
      parameters:
        - in: path
          name: petId
          schema:
            type: integer
          required: true
          description: ID of the pet
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
    put:
      tags:
        - Pet
      summary: Update pet
      parameters:
        - in: path
          name: petId
          schema:
            type: integer
          required: true
          description: ID of the pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updatePetRequest"
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/petResponse"
    delete:
      tags:
        - Pet
      summary: Delete pet
      parameters:
        - in: path
          name: petId
          schema:
            type: integer
          required: true
          description: ID of the pet
      responses:
        '200':
          description: Pet deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteResponse"
components:
  schemas:
    createPetRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Name of the pet
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        category:
          type: string
          description: Pet category
    deleteResponse:
      type: object
      properties:
        message:
          type: string
    listPetsResponse:
      type: array
      items:
        $ref: "#/components/schemas/petResponse"
    petResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        category:
          type: string
    updatePetRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold